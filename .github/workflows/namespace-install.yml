name: Namespace package installation

on:
  push:
    branches: [main]
    paths:
      - 'setup.py'
      - 'setup.cfg'
      - 'owlbot.py'
      - 'MANIFEST.in'
      - 'google/**'
      - 'vertexai/**'
      - 'agentplatform/**'
      - 'tests/packaging/**'
      - '.github/workflows/namespace-install.yml'
  pull_request:
    branches: [main]
    paths:
      - 'setup.py'
      - 'setup.cfg'
      - 'owlbot.py'
      - 'MANIFEST.in'
      - 'google/**'
      - 'vertexai/**'
      - 'agentplatform/**'
      - 'tests/packaging/**'
      - '.github/workflows/namespace-install.yml'

permissions:
  contents: read

jobs:
  namespace-install:
    name: Namespace install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Build and check installed namespace packages
        run: |
          set -euo pipefail
          export UV_EXCLUDE_NEWER=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ)
          uv venv --python '${{ matrix.python-version }}' .venv
          uv pip install --python .venv/bin/python \
            'build==1.3.0' 'setuptools==78.1.1' 'wheel==0.45.1' 'flit-core==3.12.0'
          uv pip freeze --python .venv/bin/python | tee "$RUNNER_TEMP/namespace-build-dependencies.txt"
          export SOURCE_DATE_EPOCH=946684800
          PYTHONHASHSEED=1 PYTHONPATH= .venv/bin/python -B -m build \
            --wheel --no-isolation --outdir dist/seed-1 .
          PYTHONHASHSEED=2 PYTHONPATH= .venv/bin/python -B -m build \
            --wheel --no-isolation --outdir dist/seed-2 .
          .venv/bin/python -I -B - <<'PY'
          import hashlib
          from pathlib import Path
          first, second = [list(Path(f"dist/seed-{seed}").glob("*.whl")) for seed in [1, 2]]
          assert len(first) == len(second) == 1
          assert first[0].name == second[0].name
          assert first[0].read_bytes() == second[0].read_bytes(), "hash seed changed wheel bytes"
          print("Hash-seed reproducibility:", hashlib.sha256(first[0].read_bytes()).hexdigest())
          PY
          .venv/bin/python -I -B tests/packaging/check_namespace_install.py dist/seed-1/*.whl
