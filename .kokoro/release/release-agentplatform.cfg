# -*- protobuffer -*-
# proto-file: google3/devtools/kokoro/config/proto/build.proto
# proto-message: BuildConfig

build_file: "google3/third_party/py/google/cloud/aiplatform/.kokoro/release/agentplatform.sh"

# 22.04 rather than 20.04: the package requires Python >= 3.10, and so do the
# current releases of `build` and `twine`. On 20.04's Python 3.8 pip resolves
# back to build 1.2.2.post1, the last release that still supported 3.8. This
# image carries python3, pip and pyenv.
#
# Pinned by digest rather than :current, so that a release is reproducible and a
# rebuild of the same tag cannot silently change the toolchain underneath it.
# This is the digest :current resolved to for the first green release build.
# Re-pin deliberately.
container_properties {
  docker_image: "us-central1-docker.pkg.dev/kokoro-container-bakery/kokoro/ubuntu/ubuntu2204/full@sha256:a24c8287bad3a2d09eecbff0b98b8c339a3331fe5e3349d26599f3e130358244"
}

fileset_artifacts: {
  name: "logs"
  artifact_globs: "**/*sponge_log.xml"
  generate_sbom_from_fileset: false
  generate_attestation: false
  destinations: { placer: {} }
}

# Keep a record of exactly what was staged, and attest it.
fileset_artifacts: {
  name: "built-artifacts"
  artifact_globs: "github/python-aiplatform/pypi/google_cloud_agentplatform/dist/*.whl"
  artifact_globs: "github/python-aiplatform/pypi/google_cloud_agentplatform/dist/*.tar.gz"
  error_if_missing: true
  generate_sbom_from_fileset: false  # b/460044648
  extra_sbom_globs: "*.spdx.json"
  generate_attestation: true
  destinations: {
    store_attestation: true
    gcs: {
      gcs_root_path: "oss-exit-gate-prod-projects-bucket/google-cloud-agentplatform/pypi/attestations"
    }
  }
}

# The publish manifest, retained for whoever approves the release.
fileset_artifacts: {
  name: "manifest"
  artifact_globs: "github/python-aiplatform/pypi/google_cloud_agentplatform/publish-*.json"
  generate_sbom_from_fileset: false
  generate_attestation: false
  destinations: { placer: {} }
}
